services:
  - type: web
    name: muhur-backend
    runtime: node
    rootDir: muhur-backend
    plan: free
    buildCommand: npm install && npx prisma generate && npx prisma migrate deploy && npm run build
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: muhur-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: QUOTE_TOKEN_SECRET
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_WHATSAPP_FROM
        sync: false
      - key: NOTIFY_EMAIL
        sync: false
      - key: NOTIFY_WHATSAPP_NUMBER
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false

databases:
  - name: muhur-db
    plan: free
